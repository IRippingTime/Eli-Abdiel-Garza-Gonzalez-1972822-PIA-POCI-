<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesion - EduCursos</title>
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<header class="topbar">
  <div class="logo"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3L1 9l11 6 9-4.9V15h2V9L12 3z" fill="#ff6b00"/><path d="M5 13.2V17c0 1.7 3.1 3 7 3s7-1.3 7-3v-3.8l-7 3.8-7-3.8z" fill="#ff6b00"/></svg>Edu<span>Cursos</span></div>
  <nav class="nav">
    <a href="index.html">Inicio</a>
    <a href="cursos.html">Cursos</a>
    <a href="login.html" class="activo">Entrar</a>
    <a href="registro.html">Registro</a>
    <a href="estudiante/dashboard.html">Estudiante</a>
    <a href="instructor/dashboard.html">Instructor</a>
    <a href="admin/dashboard.html">Admin</a>
    <a href="mensajes.html">Mensajes</a>
    <a href="perfil.html">Perfil</a>
  </nav>
</header>
<div class="contenedor" style="max-width:520px;">
  <div class="tarjeta">
    <h2>Iniciar sesion</h2>
    <p class="meta">Tras tres contraseñas incorrectas consecutivas, el administrador deberá reactivar la cuenta.</p>
    <div id="aviso-login"></div>
    <form onsubmit="return validarLogin(event)">
      <label for="email">Correo electronico</label>
      <input type="email" id="email" placeholder="usuario@correo.com">
      <span class="error-msg" id="err-email"></span>

      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="Tu contraseña">
      <span class="error-msg" id="err-password"></span>

      <br><br>
      <button class="btn" type="submit">Ingresar</button>
      <p>No tienes cuenta? <a href="registro.html">Registrate aqui</a></p>
    </form>
  </div>
</div>
<footer>EduCursos - Autenticacion por rol</footer>
<script src="../js/api-client.js"></script>
<script src="../js/validaciones.js"></script>
</body>
</html>

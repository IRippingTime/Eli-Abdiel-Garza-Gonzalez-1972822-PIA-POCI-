<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buscar cursos - EduCursos</title>
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<header class="topbar">
  <div class="logo"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3L1 9l11 6 9-4.9V15h2V9L12 3z" fill="#ff6b00"/><path d="M5 13.2V17c0 1.7 3.1 3 7 3s7-1.3 7-3v-3.8l-7 3.8-7-3.8z" fill="#ff6b00"/></svg>Edu<span>Cursos</span></div>
  <nav class="nav">
    <a href="index.html">Inicio</a>
    <a href="cursos.html" class="activo">Cursos</a>
    <a href="login.html">Entrar</a>
    <a href="registro.html">Registro</a>
    <a href="estudiante/dashboard.html">Estudiante</a>
    <a href="instructor/dashboard.html">Instructor</a>
    <a href="admin/dashboard.html">Admin</a>
    <a href="mensajes.html">Mensajes</a>
    <a href="perfil.html">Perfil</a>
  </nav>
</header>
<div class="contenedor">
  <main>
    <div class="tarjeta">
      <h2>Buscador de cursos</h2>
      <p class="meta">Busqueda por categoria, titulo parcial, usuario que publico o rango de fechas. Solo muestra cursos activos.</p>
      <div class="filtros">
        <input type="text" id="q" placeholder="Titulo parcial, ej. PHP" oninput="renderCatalogo()">
        <select id="f-categoria" onchange="renderCatalogo()">
          <option value="">Todas las categorias</option>
        </select>
        <input type="text" id="f-instructor" placeholder="Instructor que publico" oninput="renderCatalogo()">
        <input type="date" id="f-desde" onchange="renderCatalogo()">
        <input type="date" id="f-hasta" onchange="renderCatalogo()">
      </div>
      <p id="total-resultados" class="meta"></p>
    </div>
    <br>
    <div id="catalogo" class="grid-3"></div>
  </main>
</div>
<footer>EduCursos - Buscador con filtros establecidos</footer>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
</body>
</html>

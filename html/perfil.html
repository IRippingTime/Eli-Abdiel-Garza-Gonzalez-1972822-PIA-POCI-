<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi perfil - EduCursos</title>
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<header class="topbar">
  <div class="logo"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3L1 9l11 6 9-4.9V15h2V9L12 3z" fill="#ff6b00"/><path d="M5 13.2V17c0 1.7 3.1 3 7 3s7-1.3 7-3v-3.8l-7 3.8-7-3.8z" fill="#ff6b00"/></svg>Edu<span>Cursos</span></div>
  <nav class="nav">
    <a href="index.html">Inicio</a>
    <a href="cursos.html">Cursos</a>
    <a href="login.html">Entrar</a>
    <a href="registro.html">Registro</a>
    <a href="estudiante/dashboard.html">Estudiante</a>
    <a href="instructor/dashboard.html">Instructor</a>
    <a href="admin/dashboard.html">Admin</a>
    <a href="mensajes.html">Mensajes</a>
    <a href="perfil.html" class="activo">Perfil</a>
  </nav>
</header>
<div class="contenedor" style="max-width:640px;">
  <div class="page-hero">
    <div class="perfil-head">
      <span id="profile-avatar" class="avatar avatar-grande">?</span>
      <div>
        <span class="rol-pill">Mi perfil</span>
        <h2 id="profile-heading">Mi perfil</h2>
        <p id="profile-meta" class="meta">Cargando perfil…</p>
      </div>
    </div>
  </div>
  <br>
  <div class="tarjeta">
    <div id="aviso-perfil"></div>
    <h3>Editar informacion</h3>
    <form id="form-perfil" onsubmit="return validarPerfil(event)">
      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" autocomplete="name">
      <span class="error-msg" id="err-nombre"></span>
      <label for="email">Correo</label>
      <input type="email" id="email" autocomplete="email" readonly>
      <span class="error-msg" id="err-email"></span>
      <div class="form-grid">
        <div><label for="genero">Genero</label><select id="genero"><option value="" disabled selected>Selecciona…</option><option>Femenino</option><option>Masculino</option><option>Otro</option></select></div>
        <div><label for="nacimiento">Fecha de nacimiento</label><input id="nacimiento" type="date"></div>
      </div>
      <label for="avatar_url">Foto avatar (URL)</label>
      <input type="url" id="avatar_url" placeholder="https://...">
      <label for="avatar_file">O subir una imagen a Cloudinary</label>
      <input type="file" id="avatar_file" accept="image/jpeg,image/png,image/webp">
      <br><br><button class="btn" type="submit">Guardar cambios</button>
    </form>
  </div>
</div>
<footer>Perfil editable</footer>
<script src="../js/api-client.js"></script>
<script src="../js/data.js"></script>
<script src="../js/validaciones.js"></script>
<script src="../js/profile.js"></script>
</body>
</html>

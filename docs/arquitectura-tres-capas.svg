<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="780" viewBox="0 0 1000 780" font-family="Arial, sans-serif">
  <rect width="1000" height="780" fill="#f5f5f5"/>
  <text x="500" y="40" text-anchor="middle" font-size="26" font-weight="bold" fill="#0a0a0a">Arquitectura en tres capas · EduCursos</text>

  <!-- CAPA 1 -->
  <g>
    <rect x="40" y="65" width="920" height="170" rx="12" fill="#ffffff" stroke="#0a0a0a" stroke-width="3"/>
    <rect x="40" y="65" width="920" height="44" rx="12" fill="#0a0a0a"/>
    <rect x="40" y="95" width="920" height="14" fill="#0a0a0a"/>
    <text x="60" y="94" font-size="18" font-weight="bold" fill="#ff6b00">CAPA 1 · PRESENTACIÓN (CLIENTE · NAVEGADOR)</text>
    <text x="60" y="145" font-size="17" fill="#0a0a0a">HTML5 · CSS3 · JavaScript con fetch y promesas</text>
    <text x="60" y="175" font-size="15" fill="#555555">Vistas, validaciones del lado del cliente, categorías siempre visibles. Sin acceso a la base de datos.</text>
    <text x="60" y="205" font-size="15" font-weight="bold" fill="#cc5500">Tecnología: HTML + CSS (styles.css) + JS (app.js, validaciones.js, data.js)</text>
  </g>

  <!-- Flecha 1 -->
  <line x1="500" y1="245" x2="500" y2="285" stroke="#ff6b00" stroke-width="4"/>
  <polygon points="500,295 488,278 512,278" fill="#ff6b00"/>
  <text x="520" y="272" font-size="15" font-weight="bold" fill="#0a0a0a">HTTP / JSON (fetch)</text>

  <!-- CAPA 2 -->
  <g>
    <rect x="40" y="300" width="920" height="230" rx="12" fill="#ffffff" stroke="#0a0a0a" stroke-width="3"/>
    <rect x="40" y="300" width="920" height="44" rx="12" fill="#0a0a0a"/>
    <rect x="40" y="330" width="920" height="14" fill="#0a0a0a"/>
    <text x="60" y="329" font-size="18" font-weight="bold" fill="#ff6b00">CAPA 2 · LÓGICA / CAPA INTERMEDIA (SERVIDOR PHP)</text>
    <text x="60" y="375" font-size="17" fill="#0a0a0a">Router → Middleware [ CORS → Auth (sesión y rol) → Log ] → Controladores → Modelos</text>
    <rect x="60" y="395" width="880" height="70" rx="8" fill="#fff1e6" stroke="#ff6b00" stroke-width="3"/>
    <text x="80" y="422" font-size="16" font-weight="bold" fill="#0a0a0a">API PROPIA AQUÍ: Api/CursoApiController · Api/CategoriaApiController</text>
    <text x="80" y="447" font-size="14" fill="#555555">REST · JSON (application/json) · Códigos 200 / 201 / 400 / 401 / 404 / 500</text>
    <text x="60" y="495" font-size="15" font-weight="bold" fill="#cc5500">Tecnología: PHP 8 puro · POO · MVC propio · Validación en servidor</text>
  </g>

  <!-- Flecha 2 -->
  <line x1="500" y1="540" x2="500" y2="580" stroke="#ff6b00" stroke-width="4"/>
  <polygon points="500,590 488,573 512,573" fill="#ff6b00"/>
  <text x="520" y="567" font-size="15" font-weight="bold" fill="#0a0a0a">PDO (solo desde Modelos)</text>

  <!-- CAPA 3 -->
  <g>
    <rect x="40" y="595" width="920" height="150" rx="12" fill="#ffffff" stroke="#0a0a0a" stroke-width="3"/>
    <rect x="40" y="595" width="920" height="44" rx="12" fill="#0a0a0a"/>
    <rect x="40" y="625" width="920" height="14" fill="#0a0a0a"/>
    <text x="60" y="624" font-size="18" font-weight="bold" fill="#ff6b00">CAPA 3 · DATOS (MySQL)</text>
    <text x="60" y="670" font-size="17" fill="#0a0a0a">Tablas · Llaves primarias y foráneas · Integridad referencial (InnoDB)</text>
    <text x="60" y="700" font-size="15" font-weight="bold" fill="#cc5500">Tecnología: MySQL 8 · Clase Database (PDO) centralizada · Script .sql</text>
  </g>
</svg>
